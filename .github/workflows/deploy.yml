# On push to main: build the Docker image, push it to GHCR, then deploy to the VPS.
# Same flow as wanton-pratama-industri.
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   VPS_HOST, VPS_USER, VPS_SSH_KEY   (deploy step is skipped until VPS_HOST is set)
#   VPS_PORT (optional, default 22)
#   CMS_ADMIN_EMAIL (optional) — login email of the first CMS admin (default admin@ymsstudio.id)
#
# The CMS (Payload, /admin) and PostgreSQL run next to the app (docker-compose.yml).
# On the first deploy this workflow generates POSTGRES_PASSWORD, PAYLOAD_SECRET and the
# first admin password (ADMIN_PASSWORD) into /var/www/ymsstudio/.env. Existing values are
# never changed. See docs/CMS.md.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  APP_DIR: /var/www/ymsstudio

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
    steps:
      - uses: actions/checkout@v4
        if: env.VPS_HOST != ''
      - name: Copy compose file to the VPS
        if: env.VPS_HOST != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: docker-compose.yml
          target: ${{ env.APP_DIR }}
      - name: Pull image and restart
        if: env.VPS_HOST != ''
        uses: appleboy/ssh-action@v1
        env:
          CMS_ADMIN_EMAIL: ${{ secrets.CMS_ADMIN_EMAIL }}
        with:
          envs: CMS_ADMIN_EMAIL
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd ${{ env.APP_DIR }}
            touch .env
            chmod 600 .env 2>/dev/null || true
            # Create a value once; an existing one is never overwritten (the database
            # password must stay the one the volume was created with).
            rand() { openssl rand -hex "$1" 2>/dev/null || head -c "$1" /dev/urandom | od -An -tx1 | tr -d ' \n'; }
            ensure_env() {
              if grep -q "^$1=." .env; then return 0; fi
              grep -v "^$1=" .env > .env.tmp || true
              printf '%s=%s\n' "$1" "$2" >> .env.tmp
              mv .env.tmp .env
              echo "Created $1 in .env"
            }
            ensure_env POSTGRES_PASSWORD "$(rand 24)"
            ensure_env PAYLOAD_SECRET "$(rand 32)"
            ensure_env ADMIN_EMAIL "${CMS_ADMIN_EMAIL:-admin@ymsstudio.id}"
            ensure_env ADMIN_PASSWORD "$(rand 12)"
            # Short-lived token from this run lets the VPS pull the private image.
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            export APP_IMAGE="${{ needs.build.outputs.image }}:${{ github.sha }}"
            docker compose pull
            # Remember the deployed image so manual `docker compose ...` on the VPS uses it.
            if grep -q '^APP_IMAGE=' .env; then
              sed -i "s#^APP_IMAGE=.*#APP_IMAGE=$APP_IMAGE#" .env
            else
              echo "APP_IMAGE=$APP_IMAGE" >> .env
            fi
            # One-time migration: the old setup ran the site with pm2 on port 3000,
            # possibly as root. Stop it for both users (sudo -n never prompts).
            if command -v pm2 >/dev/null 2>&1 && pm2 describe ymsstudio >/dev/null 2>&1; then
              pm2 delete ymsstudio && pm2 save
            fi
            if sudo -n true 2>/dev/null; then
              if sudo -n env "PATH=$PATH" pm2 describe ymsstudio >/dev/null 2>&1; then
                sudo -n env "PATH=$PATH" pm2 delete ymsstudio && sudo -n env "PATH=$PATH" pm2 save
              fi
              # Free the port only before the container exists, never from our own container.
              if [ -z "$(docker compose ps -q app 2>/dev/null)" ]; then
                sudo -n fuser -k 3000/tcp 2>/dev/null || true
                sleep 2
              fi
            fi
            docker compose version
            docker compose up -d --remove-orphans
            docker logout ghcr.io
            docker image prune -f
            # Wait until the site answers. The first request of a new release also applies
            # database migrations (on the very first deploy: schema + initial content).
            for i in $(seq 1 40); do
              if curl -fsS -o /dev/null http://127.0.0.1:3000; then
                echo "✅ Site is up. CMS: https://ymsstudio.id/admin (login: ADMIN_EMAIL / ADMIN_PASSWORD in ${{ env.APP_DIR }}/.env)"
                exit 0
              fi
              sleep 3
            done
            echo "❌ Site did not respond on 127.0.0.1:3000"; docker compose logs --tail=80 app; exit 1
      - name: Deploy skipped
        if: env.VPS_HOST == ''
        run: echo "::notice::VPS_HOST secret is not set yet. The image was pushed to GHCR but not deployed."
