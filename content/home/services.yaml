id:
  label: Layanan
  titleA: Semua yang bisnis Anda butuhkan untuk
  titleEm: tumbuh online
  text: Satu tim untuk desain, pengembangan, SEO, dan iklan — Anda cukup fokus menjalankan bisnis.
  items:
    - title: Desain & Pengembangan Web
      text: Landing page, company profile, toko online, hingga web app custom. Didesain khusus untuk brand Anda — bukan template pasaran.
    - title: SEO & Google Business
      text: Struktur SEO on-page, Search Console, dan Google Business Profile agar bisnis Anda muncul saat dicari.
    - title: Google Ads & Meta Ads
      text: Kampanye iklan yang dioptimasi untuk traffic dan konversi, dengan laporan yang mudah dipahami.
    - title: Performa & Keamanan
      text: Website cepat, SSL, backup otomatis, dan perlindungan dari spam serta serangan umum.
    - title: Analytics & Tracking
      text: GA4, Meta Pixel, dan tracking konversi WhatsApp — tahu persis dari mana pelanggan datang.
    - title: Maintenance & Support
      text: Update konten, perbaikan bug, dan bantuan teknis via WhatsApp setelah website live.
  processLabel: Cara kami bekerja
  processTitleA: Proses jelas,
  processTitleEm: tanpa ribet.
  steps:
    - title: Konsultasi
      text: Kami pelajari bisnis, target pelanggan, dan tujuan website Anda.
    - title: Desain
      text: Rancangan tampilan sesuai identitas brand, direvisi sampai pas.
    - title: Development
      text: Dibangun cepat, responsif, dan siap SEO di semua perangkat.
    - title: Launch & Support
      text: Website online, Anda dilatih mengelola, kami tetap mendampingi.
en:
  label: Services
  titleA: Everything your business needs to
  titleEm: grow online
  text: One team for design, development, SEO, and ads — so you can focus on running your business.
  items:
    - title: Web Design & Development
      text: Landing pages, company profiles, online stores, and custom web apps. Designed for your brand — never an off-the-shelf template.
    - title: SEO & Google Business
      text: On-page SEO, Search Console, and Google Business Profile so customers find you when they search.
    - title: Google Ads & Meta Ads
      text: Ad campaigns optimised for traffic and conversions, with reports that are easy to read.
    - title: Performance & Security
      text: Fast websites, SSL, automatic backups, and protection from spam and common attacks.
    - title: Analytics & Tracking
      text: GA4, Meta Pixel, and WhatsApp conversion tracking — know exactly where customers come from.
    - title: Maintenance & Support
      text: Content updates, bug fixes, and technical help over WhatsApp after launch.
  processLabel: How we work
  processTitleA: A clear process,
  processTitleEm: no hassle.
  steps:
    - title: Discovery
      text: We learn about your business, customers, and goals for the website.
    - title: Design
      text: A design that fits your brand identity, refined until it's right.
    - title: Development
      text: Built fast, responsive, and SEO-ready on every device.
    - title: Launch & Support
      text: Your site goes live, you're trained to manage it, and we stay on hand.
