id:
  label: FAQ
  titleA: Pertanyaan yang
  titleEm: sering ditanya
  items:
    - q: Berapa harga pembuatan website di YMS Studio?
      a: Mulai dari Rp 2.000.000 untuk landing page, Rp 3.500.000 untuk company profile, dan Rp 6.000.000 untuk toko online. Semua paket sudah termasuk domain, hosting 1 tahun, SSL, dan desain custom.
    - q: Berapa lama proses pembuatan website?
      a: Landing page 5–7 hari kerja, company profile 7–14 hari kerja, dan toko online 14–21 hari kerja, tergantung kelengkapan materi dari klien.
    - q: Apakah saya bisa mengubah isi website sendiri?
      a: Bisa. Paket Company Profile dan Toko Online menggunakan CMS, dan kami berikan panduan serta training agar Anda bisa mengelola konten sendiri.
    - q: Apakah website yang dibuat mobile-friendly dan SEO-ready?
      a: Ya. Semua website responsif, dioptimasi kecepatan, dan sudah disiapkan struktur SEO on-page agar mudah ditemukan di Google.
    - q: Apakah ada garansi?
      a: Ya. Setiap paket mendapat revisi desain sesuai paket, garansi perbaikan bug, dan support teknis selama masa support berlaku.
en:
  label: FAQ
  titleA: Frequently asked
  titleEm: questions
  items:
    - q: How much does a website cost at YMS Studio?
      a: From IDR 2,000,000 for a landing page, IDR 3,500,000 for a company profile, and IDR 6,000,000 for an online store. Every package includes a domain, 1 year of hosting, SSL, and custom design.
    - q: How long does it take to build a website?
      a: Landing pages take 5–7 working days, company profiles 7–14 working days, and online stores 14–21 working days, depending on how quickly materials are ready.
    - q: Can I edit the website content myself?
      a: Yes. The Company Profile and Online Store packages use a CMS, and we provide a guide and training so you can manage content yourself.
    - q: Are the websites mobile-friendly and SEO-ready?
      a: Yes. Every website is responsive, optimised for speed, and set up with on-page SEO so it's easy to find on Google.
    - q: Is there a guarantee?
      a: Yes. Every package includes design revisions, a bug-fix guarantee, and technical support for the duration of the support period.
